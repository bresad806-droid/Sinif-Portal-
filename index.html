<!DOCTYPE html>
<html lang="az">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sinif Portalı - WhatsApp Pro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    body { 
      background: #0f172a; 
      color: #f8fafc; 
      height: 100vh; 
      display: flex; 
      flex-direction: column; 
      overflow: hidden; 
      padding-top: 25px; 
    }

    header { background: #1e293b; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #334155; flex-shrink: 0; }
    header h1 { font-size: 15px; color: #38bdf8; cursor: pointer; }
    .user-info { font-size: 12px; color: #94a3b8; display: flex; gap: 8px; align-items: center; }

    .container { flex: 1; display: flex; flex-direction: column; max-width: 800px; width: 100%; margin: 0 auto; padding: 10px; gap: 10px; overflow: hidden; }
    
    .tabs { display: flex; gap: 6px; flex-shrink: 0; }
    .tab-btn { flex: 1; padding: 8px; background: #1e293b; border: 1px solid #334155; color: #94a3b8; border-radius: 8px; cursor: pointer; font-weight: bold; font-size: 11px; text-align: center; }
    .tab-btn.active { background: #38bdf8; color: #0f172a; border-color: #38bdf8; }

    .section { display: none; flex: 1; flex-direction: column; background: #1e293b; border-radius: 12px; border: 1px solid #334155; overflow: hidden; }
    .section.active { display: flex; }

    /* Üzvlər / Şəxsi Çat Siyahısı */
    .users-list-content { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #0b1329; flex: 1; }
    .user-item-box { background: #1e293b; padding: 10px 14px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; cursor: pointer; border: 1px solid #334155; }

    /* Çat Bölməsi */
    .chat-messages { flex: 1; padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; background: #0b1329; }
    .message { background: #1e293b; padding: 8px 12px; border-radius: 8px; max-width: 85%; word-break: break-word; font-size: 13px; }
    .message.mine { background: #0284c7; align-self: flex-end; }
    .message .sender { font-size: 10px; color: #38bdf8; margin-bottom: 2px; font-weight: bold; display: flex; justify-content: space-between; gap: 10px; }
    .del-btn { background: none; border: none; color: #f87171; cursor: pointer; font-size: 10px; }

    .chat-input-box { display: flex; padding: 8px; background: #1e293b; border-top: 1px solid #334155; gap: 6px; flex-shrink: 0; align-items: center; }
    .chat-input-box input { flex: 1; padding: 8px 12px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; outline: none; font-size: 13px; }
    .mic-btn { background: #334155; color: #38bdf8; border: none; padding: 8px 10px; border-radius: 8px; font-size: 14px; cursor: pointer; }
    .mic-btn.recording { background: #ef4444; color: white; animation: pulse 1s infinite; }
    .chat-input-box button.send-btn { padding: 8px 14px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.5; } 100% { opacity: 1; } }

    /* Cədvəl Bölməsi */
    .schedule-content { padding: 12px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .day-card { background: #0f172a; padding: 12px; border-radius: 8px; border-left: 4px solid #38bdf8; }
    .day-card h3 { color: #38bdf8; margin-bottom: 6px; font-size: 14px; display: flex; justify-content: space-between; align-items: center; }
    .day-card ul { list-style-type: none; padding-left: 5px; }
    .day-card li { padding: 3px 0; font-size: 12px; color: #cbd5e1; border-bottom: 1px solid #1e293b; }
    .edit-sched-btn { background: #334155; color: #38bdf8; border: none; padding: 3px 6px; border-radius: 4px; cursor: pointer; font-size: 10px; }

    /* Səsli Zəng */
    .call-content { padding: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 15px; text-align: center; flex: 1; }
    .call-btn { padding: 12px 25px; background: #22c55e; color: white; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }
    .hangup-btn { padding: 12px 25px; background: #ef4444; color: white; border: none; border-radius: 25px; font-size: 14px; font-weight: bold; cursor: pointer; }

    /* Modallar */
    .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(15, 23, 42, 0.95); display: flex; justify-content: center; align-items: center; z-index: 100; }
    .modal-box { background: #1e293b; padding: 22px; border-radius: 14px; border: 1px solid #334155; width: 330px; text-align: center; display: flex; flex-direction: column; gap: 12px; }
    .modal-box h2 { color: #38bdf8; font-size: 18px; }
    .modal-box input, .modal-box select { padding: 10px; background: #0f172a; border: 1px solid #475569; color: white; border-radius: 8px; outline: none; font-size: 13px; }
    .modal-box button { padding: 10px; background: #38bdf8; color: #0f172a; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }

    .user-list-item { display: flex; flex-direction: column; gap: 4px; font-size: 12px; background: #0f172a; padding: 8px; border-radius: 6px; margin-bottom: 6px; text-align: left; }
    .admin-actions { display: flex; gap: 4px; flex-wrap: wrap; }
    .action-btn { background: #ef4444; color: white; border: none; padding: 4px 6px; border-radius: 4px; font-size: 10px; cursor: pointer; }
    .mute-btn { background: #f59e0b; }
    .login-btn { background: #3b82f6; }
    .unmute-btn { background: #10b981; }
  </style>
</head>
<body>

  <!-- Audio fayllar -->
  <audio id="sound-whatsapp" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>
  <audio id="sound-beep" src="https://assets.mixkit.co/active_storage/sfx/2578/2578-preview.mp3" preload="auto"></audio>
  <audio id="sound-ring" src="https://assets.mixkit.co/active_storage/sfx/1360/1360-preview.mp3" preload="auto"></audio>

  <!-- Giriş Modalı (Əgər istifadəçi yoxdursa dərhal görünür) -->
  <div id="login-modal" class="modal" style="display:flex;">
    <div class="modal-box">
      <h2>Sinif Portalına Giriş</h2>
      <p style="font-size: 12px; color: #94a3b8;">Zəhmət olmasa adınızı daxil edin:</p>
      <input type="text" id="username-input" placeholder="Məsələn: Nihad" autocomplete="off">
      <button onclick="loginUser()">Daxil ol</button>
    </div>
  </div>

  <!-- Parametrlər (Ayarlar) Modalı -->
  <div id="settings-modal" class="modal" style="display:none;">
    <div class="modal-box">
      <h2>⚙️ Parametrlər</h2>
      
      <div style="text-align: left; font-size: 12px; display: flex; flex-direction: column; gap: 10px;">
        <div>
          <label style="color:#cbd5e1;">İstifadəçi Adı:</label>
          <div style="display:flex; gap:6px; margin-top:4px;">
            <input type="text" id="edit-name-input" style="flex:1;">
            <button onclick="changeName()" style="padding:6px 10px; font-size:11px;">Dəyiş</button>
          </div>
        </div>

        <div>
          <label style="color:#cbd5e1;">Bildiriş Səsi Seçimi:</label>
          <select id="sound-select" onchange="changeSoundChoice()" style="width:100%; margin-top:4px;">
            <option value="whatsapp">WhatsApp Bip Səsi 🔔</option>
            <option value="beep">Qısa Bip Səsi ⚡</option>
            <option value="ring">Zəng Səsi 📞</option>
            <option value="none">Səssiz 🔇</option>
          </select>
        </div>

        <hr style="border:0.5px solid #334155; margin: 5px 0;">

        <button onclick="openAdminModalFromSettings()" style="background:#ef4444; color:white; font-size:12px;">👑 Admin Paneline Giriş (Şifrəli)</button>
      </div>

      <button onclick="document.getElementById('settings-modal').style.display='none'" style="background:#475569; color:white; margin-top:5px;">Bağla</button>
    </div>
  </div>

  <!-- Admin Paneli Modalı -->
  <div id="admin-modal" class="modal" style="display:none;">
    <div class="modal-box" style="width: 360px;">
      <h2>👑 Nihadın Admin Paneli</h2>
      <p style="font-size: 11px; color: #f87171;">İdarəetmə və Cəzalandırma:</p>
      <div id="admin-users-container" style="max-height: 250px; overflow-y: auto;"></div>
      <button onclick="document.getElementById('admin-modal').style.display='none'">Bağla</button>
    </div>
  </div>

  <header>
    <h1 onclick="backToGroupChat()" id="header-title">🎓 Sinifimiz (Qrup Çatı)</h1>
    <div class="user-info">
      <span id="display-user">İstifadəçi</span>
      <span id="admin-badge" style="background:#ef4444; color:white; padding:2px 6px; border-radius:4px; font-size:10px; display:none; font-weight:bold;">ADMİN</span>
      <button onclick="openSettings()" style="background:#334155; color:#38bdf8; border:1px solid #475569; padding:4px 8px; border-radius:4px; font-size:11px; cursor:pointer;">⚙️</button>
    </div>
  </header>

  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" id="tab-chat-btn" onclick="switchTab('chat', this)">💬 Qrup</button>
      <button class="tab-btn" id="tab-users-btn" onclick="switchTab('users', this)">👥 Şəxsi</button>
      <button class="tab-btn" onclick="switchTab('schedule', this)">📅 Cədvəl</button>
      <button class="tab-btn" onclick="switchTab('call', this)">📞 Zəng</button>
    </div>

    <!-- Qrup Çat Bölməsi -->
    <div id="chat-section" class="section active">
      <div class="chat-messages" id="chat-messages"></div>
      <div class="chat-input-box">
        <button id="mic-btn" class="mic-btn" onclick="toggleRecordAudio()" title="Səs Yaz və Göndər">🎤</button>
        <input type="text" id="msg-input" placeholder="Mesaj yazın..." onkeypress="checkEnter(event)">
        <button class="send-btn" onclick="sendMessage()">Göndər</button>
      </div>
    </div>

    <!-- Şəxsi Mesajlaşma Üçün İstifadəçilər Siyahısı -->
    <div id="users-section" class="section">
      <div class="users-list-content" id="users-list-container"></div>
    </div>

    <!-- Dərs Cədvəli -->
    <div id="schedule-section" class="section">
      <div class="schedule-content" id="schedule-container"></div>
    </div>

    <!-- Səsli Zəng -->
    <div id="call-section" class="section">
      <div class="call-content" id="call-box">
        <h3 style="color: #38bdf8;" id="call-status-title">Sinif Səsli Konfransı</h3>
        <p style="font-size: 12px; color: #94a3b8;" id="call-status-desc">Canlı səsli əlaqə otağı.</p>
        <div id="call-actions-div" style="display:flex; gap:10px;">
          <button class="call-btn" onclick="startCall()">Zəng Et 🎙️</button>
        </div>
      </div>
    </div>
  </div>

  <script>
    let currentUser = localStorage.getItem('portal_current_user') || "";
    let isUserAdmin = false;
    let currentPrivateTarget = null;
    let selectedSound = localStorage.getItem('portal_sound') || "whatsapp";
    
    let activeUsers = JSON.parse(localStorage.getItem('portal_users')) || ["Nihad", "Orxan", "Leyla", "Elmir"];
    let kickedUsers = JSON.parse(localStorage.getItem('portal_kicked')) || [];
    let mutedDict = JSON.parse(localStorage.getItem('portal_muted')) || {};
    let chatHistory = JSON.parse(localStorage.getItem('portal_chats')) || [];
    let privateChats = JSON.parse(localStorage.getItem('portal_private_chats')) || {};
    
    let scheduleData = JSON.parse(localStorage.getItem('portal_schedule')) || {
      bazar1: ["Azərbaycan Dili", "Riyaziyyat", "Fizika"],
      bazar2: ["Kimya", "İngilis Dili", "Tarix"],
      bazar3: ["Ədəbiyyat", "Biologiya", "Coğrafiya"],
      bazar4: ["Riyaziyyat", "Fizika", "İnformatika"],
      bazar5: ["İngilis Dili", "Azərbaycan Dili", "Bədən tərbiyəsi"]
    };

    let mediaRecorder = null;
    let audioChunks = [];
    let isRecording = false;

    window.onload = function() {
      if(currentUser) {
        if(kickedUsers.includes(currentUser)) {
          localStorage.removeItem('portal_current_user');
          currentUser = "";
          document.getElementById('login-modal').style.display = 'flex';
          return;
        }
        document.getElementById('login-modal').style.display = 'none';
        initApp();
      } else {
        document.getElementById('login-modal').style.display = 'flex';
      }
    };

    function playSound() {
      if(selectedSound === "none") return;
      let el = document.getElementById("sound-" + selectedSound);
      if(!el) el = document.getElementById("sound-whatsapp");
      if(el) {
        el.currentTime = 0;
        el.play().catch(e => console.log(e));
      }
    }

    function loginUser() {
      const input = document.getElementById('username-input').value.trim();
      if(input === "") { alert("Zəhmət olmasa adınızı daxil edin!"); return; }
      currentUser = input;

      if(kickedUsers.includes(currentUser)) {
        alert("Siz bu qrupdan kənarlaşdırılmısınız!");
        return;
      }

      localStorage.setItem('portal_current_user', currentUser);
      document.getElementById('login-modal').style.display = 'none';
      initApp();

      if(chatHistory.length === 0) {
        chatHistory.push({ id: Date.now(), sender: "Sistem", type: 'text', content: "Salam " + currentUser + "! WhatsApp stil qrupumuza xoş gəldiniz." });
        saveState();
        renderChatHistory();
      }
    }

    function initApp() {
      checkAdminStatus();
      if(!activeUsers.includes(currentUser)) activeUsers.push(currentUser);
      saveState();

      renderChatHistory();
      renderSchedule();
      renderUsersList();
    }

    function checkAdminStatus() {
      if(currentUser.toLowerCase() === "nihad") {
        isUserAdmin = true;
        document.getElementById('admin-badge').style.display = "inline-block";
      } else {
        isUserAdmin = false;
        document.getElementById('admin-badge').style.display = "none";
      }
      document.getElementById('display-user').innerText = currentUser;
    }

    function saveState() {
      localStorage.setItem('portal_current_user', currentUser);
      localStorage.setItem('portal_users', JSON.stringify(activeUsers));
      localStorage.setItem('portal_kicked', JSON.stringify(kickedUsers));
      localStorage.setItem('portal_muted', JSON.stringify(mutedDict));
      localStorage.setItem('portal_chats', JSON.stringify(chatHistory));
      localStorage.setItem('portal_private_chats', JSON.stringify(privateChats));
      localStorage.setItem('portal_schedule', JSON.stringify(scheduleData));
      localStorage.setItem('portal_sound', selectedSound);
    }

    function switchTab(tabName, btn) {
      document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));

      if(tabName === 'chat') {
        currentPrivateTarget = null;
        document.getElementById('header-title').innerText = "🎓 Sinifimiz (Qrup Çatı)";
        document.getElementById('chat-section').classList.add('active');
